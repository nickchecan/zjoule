name: Build, Test and Deploy

on:
  push:
    paths:
      - 'com.developer.nefarious.zjoule.feature/**'
      - 'com.developer.nefarious.zjoule.libs/**'
      - 'com.developer.nefarious.zjoule.plugin/**'
      - 'com.developer.nefarious.zjoule.test/**'
      - 'com.developer.nefarious.zjoule.updatesite/**'

permissions:
  contents: write
  # semantic-release comments on released issues after it publishes.
  issues: write
  pull-requests: write

jobs:

  test:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven Wrapper
        run: ./mvnw clean verify

  release:
    needs: test
    # Releases are off. To turn them on, set the repository variable RELEASE_ENABLED
    # to the string true: Settings → Secrets and variables → Actions → Variables.
    # Delete that variable (or set it to anything other than true) to turn releases off again.
    if: "vars.RELEASE_ENABLED == 'true' && !contains(github.event.head_commit.message, 'skip ci') && github.ref == 'refs/heads/main'"
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # semantic-release needs tags and history to find the last release.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install semantic-release
        # One node_modules so semantic-release 22.0.12 can resolve the pinned
        # plugins beside it. `npx semantic-release` ignores a global pin and
        # downloads 25.x, which then fails to find @semantic-release/changelog.
        run: |
          npm install --prefix "$RUNNER_TEMP/semantic-release" --no-fund --no-audit \
            semantic-release@22.0.12 \
            @semantic-release/changelog@6.0.3 \
            @semantic-release/commit-analyzer@11.1.0 \
            @semantic-release/exec@6.0.3 \
            @semantic-release/git@10.0.1 \
            @semantic-release/release-notes-generator@12.1.0

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./scripts/prepare-release.sh
          "$RUNNER_TEMP/semantic-release/node_modules/.bin/semantic-release"

  update-website:
    needs: release
    # Same switch as the release job. Skipped while RELEASE_ENABLED is not true.
    if: "vars.RELEASE_ENABLED == 'true' && !contains(github.event.head_commit.message, 'skip ci') && github.ref == 'refs/heads/main'"
    runs-on: ubuntu-latest
    env:
      # PAT for nickchecan/zjoule-website. This job succeeds without it so a
      # missing website repo cannot fail the plugin release.
      GH_TOKEN: ${{ secrets.ZJOULE_WEBSITE_TOKEN }}
      WEBSITE_REPOSITORY: nickchecan/zjoule-website
    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check website publishing configuration
        id: website
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Website update skipped::ZJOULE_WEBSITE_TOKEN is not set. The plugin release is unaffected. Add a fine-grained PAT for ${WEBSITE_REPOSITORY} with Contents read and write, Pull requests read and write, and Administration. Administration is required because this job runs 'gh pr merge --admin', which only succeeds for an admin of that repository."
            exit 0
          fi
          if ! gh repo view "${WEBSITE_REPOSITORY}" --json name >/dev/null 2>&1; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Website update skipped::${WEBSITE_REPOSITORY} is not reachable with ZJOULE_WEBSITE_TOKEN. The plugin release is unaffected."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Get the latest release tag
        id: get_release
        if: steps.website.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! LATEST_TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q ".tagName"); then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Website update skipped::No GitHub release exists on ${{ github.repository }} yet."
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "LATEST_TAG=${LATEST_TAG}" >> "$GITHUB_ENV"

      - name: Configure Git
        if: steps.website.outputs.ready == 'true' && steps.get_release.outputs.found == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Clone the website repository
        if: steps.website.outputs.ready == 'true' && steps.get_release.outputs.found == 'true'
        run: |
          git clone "https://github.com/${WEBSITE_REPOSITORY}.git" website-repo

      - name: Create a new branch
        if: steps.website.outputs.ready == 'true' && steps.get_release.outputs.found == 'true'
        working-directory: website-repo
        run: |
          git checkout -b "update-to-${LATEST_TAG}"

      - name: Run the script to update the website
        if: steps.website.outputs.ready == 'true' && steps.get_release.outputs.found == 'true'
        working-directory: website-repo
        run: |
          chmod +x ../scripts/update-website.sh
          ../scripts/update-website.sh "${LATEST_TAG}"

      - name: Commit the changes
        id: commit
        if: steps.website.outputs.ready == 'true' && steps.get_release.outputs.found == 'true'
        working-directory: website-repo
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Website update skipped::No website files changed for ${LATEST_TAG}."
            exit 0
          fi
          git commit -m "feat: update to ${LATEST_TAG}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push the changes
        if: steps.website.outputs.ready == 'true' && steps.get_release.outputs.found == 'true' && steps.commit.outputs.changed == 'true'
        working-directory: website-repo
        run: |
          git push origin "update-to-${LATEST_TAG}"

      - name: Create a pull request
        if: steps.website.outputs.ready == 'true' && steps.get_release.outputs.found == 'true' && steps.commit.outputs.changed == 'true'
        working-directory: website-repo
        env:
          GH_TOKEN: ${{ secrets.ZJOULE_WEBSITE_TOKEN }}
        run: |
          gh pr create \
            --repo "${WEBSITE_REPOSITORY}" \
            --title "Update to ${LATEST_TAG}" \
            --body "This PR updates the website to the latest release ${LATEST_TAG}." \
            --head "update-to-${LATEST_TAG}" \
            --base main

      - name: Automatically merge the pull request
        if: steps.website.outputs.ready == 'true' && steps.get_release.outputs.found == 'true' && steps.commit.outputs.changed == 'true'
        working-directory: website-repo
        env:
          GH_TOKEN: ${{ secrets.ZJOULE_WEBSITE_TOKEN }}
        run: |
          gh pr merge "update-to-${LATEST_TAG}" --repo "${WEBSITE_REPOSITORY}" --squash --admin --delete-branch
